services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: obsalert
    ports: ["5433:5432"]
    # ponytail: pg_isready is enough; app waits on it instead of retrying itself
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/obsalert
      PUBLIC_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
