<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OBS Alert Overlay</title>
<style>
  /* ---- THEME: edit these ---- */
  :root {
    --accent: #7c5cff;
    --bg: rgba(14, 14, 20, 0.92);
    --fg: #ffffff;
    --font: "Inter", "Segoe UI", system-ui, sans-serif;
    --radius: 14px;
    --width: 520px;
    --pad: 40px;
  }
  /* --------------------------- */

  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--fg); }

  #stage {
    position: fixed; inset: var(--pad);
    display: flex;
    justify-content: var(--justify, center);
    align-items: var(--align, flex-start);
  }

  #card {
    box-sizing: border-box;
    max-width: var(--width);
    background: var(--bg);
    border-left: 6px solid var(--accent);
    border-radius: var(--radius);
    padding: 18px 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    text-align: center;
    opacity: 0;
    transform: translateY(-24px) scale(0.96);
    transition: opacity 280ms ease, transform 280ms cubic-bezier(0.2, 0.9, 0.3, 1.3);
  }
  #card.show { opacity: 1; transform: translateY(0) scale(1); }

  #img { display: none; max-width: 100%; max-height: 240px; border-radius: 10px; margin-bottom: 12px; }
  #img.on { display: block; margin-inline: auto; }

  #title {
    display: none;
    font-size: 15px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px;
  }
  #title.on { display: block; }

  #text { font-size: 28px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <img id="img" alt="">
    <div id="title"></div>
    <div id="text"></div>
  </div>
</div>

<script>
(() => {
  const card = document.getElementById('card');
  const img = document.getElementById('img');
  const title = document.getElementById('title');
  const text = document.getElementById('text');

  // URL overrides so position/color change without editing this file:
  //   ...?pos=top-right&accent=%23ff0066&width=600
  const q = new URLSearchParams(location.search);
  const POS = {
    'top-left':      ['flex-start', 'flex-start'],
    'top':           ['center',     'flex-start'],
    'top-right':     ['flex-end',   'flex-start'],
    'center':        ['center',     'center'],
    'bottom-left':   ['flex-start', 'flex-end'],
    'bottom':        ['center',     'flex-end'],
    'bottom-right':  ['flex-end',   'flex-end'],
  };
  const pos = POS[q.get('pos')] || POS.top;
  document.documentElement.style.setProperty('--justify', pos[0]);
  document.documentElement.style.setProperty('--align', pos[1]);
  for (const k of ['accent', 'bg', 'fg', 'font', 'width', 'radius', 'pad']) {
    const v = q.get(k);
    if (v) document.documentElement.style.setProperty('--' + k, v);
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ponytail: unbounded queue. A flood just plays a long backlog; cap it if that ever bites.
  const queue = [];
  let draining = false;

  async function drain() {
    if (draining) return;
    draining = true;
    while (queue.length) {
      const a = queue.shift();

      // textContent / src assignment only — payload is never parsed as markup.
      text.textContent = a.text;
      title.textContent = a.title || '';
      title.classList.toggle('on', !!a.title);
      if (a.image) { img.src = a.image; img.classList.add('on'); }
      else { img.removeAttribute('src'); img.classList.remove('on'); }

      if (a.sound) {
        // Needs "Control audio via OBS" ticked on the Browser Source to reach the stream mix.
        new Audio(a.sound).play().catch((e) => console.warn('[alert] sound blocked:', e.message));
      }

      card.classList.add('show');
      await sleep(Math.max(100, Number(a.duration) || 5000));
      card.classList.remove('show');
      await sleep(400); // let the fade finish before the next one
    }
    draining = false;
  }

  const es = new EventSource('/events'); // auto-reconnects if the server restarts
  es.onmessage = (e) => {
    try {
      queue.push(JSON.parse(e.data));
      drain();
    } catch (err) {
      console.warn('[alert] bad payload:', err.message);
    }
  };
  es.onopen = () => console.log('[alert] connected');
  es.onerror = () => console.warn('[alert] disconnected, retrying…');
})();
</script>
</body>
</html>
