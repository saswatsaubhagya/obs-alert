name: docker

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      # CalVer, no zero padding: 2026.9.12. A second release on the same day
      # gets .2, .3, ... — the runner clock is UTC, so "today" is UTC's today.
      # ponytail: races if two pushes land at once; re-run the failed job.
      - id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d=$(date -u +%Y.%-m.%-d); v=$d; n=1
          while gh release view "$v" >/dev/null 2>&1; do
            n=$((n + 1)); v="$d.$n"
          done
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build — no credentials to push, nothing to release.
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.v }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last: a release tag should only exist for an image that actually built.
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.v }}
        run: |
          gh release create "$V" --title "$V" --target "$GITHUB_SHA" --generate-notes \
            --notes "\`\`\`
          docker pull ghcr.io/${GITHUB_REPOSITORY}:${V}
          \`\`\`"
