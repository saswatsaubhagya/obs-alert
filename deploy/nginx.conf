# Reverse proxy config for the obs-alert-platform Next.js app.
# Drop this inside a `server { }` block (with your own listen/server_name/TLS).
#
# The app must run as a single long-lived Node process (`npm start`, or the
# Dockerfile's CMD) — the SSE hub and the rate limiter are in-process state,
# so this must not be load-balanced across multiple app instances.

# The ingest key travels in the URL path (POST /api/v1/alerts/<ingest_key>),
# so this route's URI must never be logged.
location /api/v1/alerts/ {
  access_log off;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
}

# SSE overlay stream (GET /api/overlay/<token>/events): no buffering, no
# read timeout, or the connection dies and OBS silently stops receiving
# alerts. HTTP/1.1 with Connection cleared keeps nginx from trying to
# reuse/chunk the stream underneath the app's own framing.
location /api/overlay/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Connection '';
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 24h;
}

location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
}
